# Nginx untuk ib.<domain> — menyajikan build statis (dist/) dengan fallback SPA.
# Ganti "example.sch.id" dengan domain sekolah. Sertifikat dari Let's Encrypt (certbot).

server {
    listen 80;
    listen [::]:80;
    server_name ib.example.sch.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ib.example.sch.id;

    ssl_certificate     /etc/letsencrypt/live/ib.example.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ib.example.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/bank-provita-ib/dist;
    index index.html;

    # --- Header keamanan ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # connect-src harus memuat alamat API (api.<domain>).
    # PrimeVue menyuntikkan <style> saat runtime, sehingga style-src memerlukan 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.example.sch.id; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Aset ber-hash dari Vite: cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Mock Service Worker tidak boleh tersaji di produksi
    location = /mockServiceWorker.js {
        return 404;
    }

    # Fallback SPA
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.example.sch.id; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
